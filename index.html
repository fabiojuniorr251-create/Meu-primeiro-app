<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu App no Ar!</title>
<style>
body{font-family:Arial;text-align:center;padding:20px;background:#f0f2f5;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.card{background:white;padding:30px;border-radius:20px;box-shadow:0 5px 20px rgba(0,0,0,0.1);width:100%;max-width:360px}
button{background:#111;color:white;border:none;padding:14px;border-radius:12px;width:100%;font-size:16px;margin-top:10px}
input{width:100%;padding:12px;margin:10px 0;border-radius:10px;border:1px solid #ccc;box-sizing:border-box}
#telaApp{display:none}
</style>
</head>
<body>
<div class="card" id="telaLogin">
<h2>🚀 Meu App no Ar!</h2>
<p>Digite seu nome para entrar</p>
<input id="nome" placeholder="Seu nome">
<button onclick="entrar()">Entrar no App</button>
</div>
<div class="card" id="telaApp">
<h2 id="msg"></h2>
<p>✅ Logado com sucesso!</p>
<p>Seu app agora tem 2 telas.</p>
<button onclick="sair()" style="background:#666">Sair</button>
</div>
<script>
function entrar(){
let n=document.getElementById('nome').value;
if(!n){alert('Digite seu nome!');return}
document.getElementById('telaLogin').style.display='none';
document.getElementById('telaApp').style.display='block';
document.getElementById('msg').innerText='Bem-vindo, '+n+'! 🎉';
}
function sair(){
document.getElementById('telaApp').style.display='none';
document.getElementById('telaLogin').style.display='block';
document.getElementById('nome').value='';
}
</script>
</body>
</html>
