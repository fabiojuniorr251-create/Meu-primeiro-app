<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu App</title>
<link rel="icon" href="IMG-20261004-WA6629.jpg">
<link rel="apple-touch-icon" href="IMG-20261004-WA6629.jpg">
<style>
body{font-family:Arial;text-align:center;padding:30px;background:#f0f2f5}
.card{background:white;padding:20px;border-radius:15px;max-width:350px;margin:auto;box-shadow:0 4px 10px rgba(0,0,0,0.1)}
button{background:#111;color:white;border:none;padding:12px 20px;border-radius:8px;width:100%;margin-top:10px;font-size:16px}
input{width:100%;padding:12px;margin:10px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
</style>
</head>
<body>
<div class="card">
<h2>🚀 Meu App no Ar!</h2>
<p>Digite seu nome para entrar</p>
<input id="nome" placeholder="Seu nome">
<button onclick="entrar()">Entrar no App</button>
<p id="msg"></p>
</div>
<script>
function entrar(){
let n=document.getElementById('nome').value
document.getElementById('msg').innerHTML='Bem-vindo, '+n+'! 🎉'
}
</script>
</body>
</html>
